[workspace]
resolver = "3"
members = [
    "crates/git",
    "crates/logic",
    "crates/ui",
    "crates/validation",
    "crates/wiring",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "deny"
shadow_unrelated = "deny"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
